<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Type-it harness</title>
<link rel="stylesheet" href="gym.css">
<style>
  body{margin:0;padding:16px;background:#e9e9e4;font-family:system-ui,sans-serif}
  .frame{border:1px solid #bbb;background:#fff;width:390px}
  .frame .gv-app{display:flex;flex-direction:column;min-height:460px}
  pre{background:#fff;border:1px solid #ccc;padding:8px;font-size:12px;max-width:390px;margin-top:10px}
</style></head>
<body>
  <div class="frame"><div class="gv-app gv-narrow gv-skin-floor gv-accent-lime" id="host"></div></div>
  <pre id="log">count = 0</pre>
<script src="bundle.js"></script>
<script>
  const shared = window.__shared, rc = window.__repcounter;
  const host = document.getElementById('host'), log = document.getElementById('log');
  let state = rc.createCounter();
  const countEl = document.createElement('div');
  countEl.className = 'gv-rc-count'; countEl.setAttribute('aria-live','polite'); countEl.textContent = '0';
  const zone = document.createElement('div');
  zone.className = 'gv-rc-zone'; zone.setAttribute('role','button'); zone.tabIndex = 0;
  zone.append(countEl);
  const bar = document.createElement('div'); bar.className = 'gv-rc-bar';
  const controls = document.createElement('div'); controls.className = 'gv-rc-controls';
  bar.append(controls);
  const show = () => { countEl.textContent = String(state.count); log.textContent = 'count = ' + state.count + '  lastTapAt = ' + state.lastTapAt; };
  const typeBtn = shared.typeCountButton(countEl, {
    label: 'Reps', get: () => state.count,
    set: n => { state = { count: n, lastTapAt: state.lastTapAt }; show(); },
  });
  controls.append(typeBtn);
  shared.attachTapZone(zone, () => { const r = rc.tap(state, Date.now()); state = r.state; if (r.counted) show(); });
  host.append(bar, zone);
  window.__state = () => state;
</script>
</body></html>
