<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Count-in harness</title>
<link rel="stylesheet" href="gym.css">
<style>
  body{margin:0;padding:16px;background:#e9e9e4;font-family:system-ui,sans-serif}
  .lab{font:600 11px/1.6 system-ui;color:#555;letter-spacing:.05em;text-transform:uppercase;margin:12px 0 4px}
  .frame{border:1px solid #bbb;background:#fff;width:390px;overflow:hidden}
  .frame .gv-app{display:flex;flex-direction:column;min-height:420px}
  button.go{font:inherit;padding:7px 12px;margin:0 6px 0 0;cursor:pointer}
  pre{background:#fff;border:1px solid #ccc;padding:8px;font-size:12px;max-width:390px}
</style></head>
<body>
  <button class="go" id="run">Run count-in (3s)</button>
  <button class="go" id="mute">muted: yes</button>
  <div class="lab">iPhone 390px — .gv-narrow</div>
  <div class="frame"><div class="gv-app gv-narrow gv-skin-floor gv-accent-lime" id="host"></div></div>
  <pre id="log">idle</pre>
<script src="bundle.js"></script>
<script>
  const cd = window.__countdown;
  const host = document.getElementById('host');
  const log = document.getElementById('log');
  let muted = true, stop = null, doneCount = 0;
  document.getElementById('mute').addEventListener('click', e => {
    muted = !muted; e.target.textContent = 'muted: ' + (muted ? 'yes' : 'no');
  });
  document.getElementById('run').addEventListener('click', () => {
    if (stop) stop();
    host.textContent = '';
    doneCount = 0;
    const t0 = Date.now();
    log.textContent = 'running…';
    stop = cd.runCountIn(host, {
      label: 'Push-ups · set 2 of 3',
      muted, settings: { soundMode: 'voice', voiceURI: '' },
      onDone: () => {
        doneCount++;
        log.textContent = 'onDone x' + doneCount + ' after ' + (Date.now() - t0) + 'ms';
        host.textContent = '';
        const p = document.createElement('div');
        p.className = 'gv-session-body';
        p.textContent = 'the set would render here';
        host.append(p);
      },
    });
  });
</script>
</body></html>
