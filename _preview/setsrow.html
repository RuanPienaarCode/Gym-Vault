<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sets row harness</title>
<link rel="stylesheet" href="gym.css">
<style>
  body{margin:0;padding:16px;background:#e9e9e4;font-family:system-ui,sans-serif}
  .frame{border:1px solid #bbb;background:#fff;width:390px}
</style></head>
<body>
  <div class="frame"><div class="gv-app gv-narrow gv-skin-floor gv-accent-lime" id="host"></div></div>
<script src="bundle.js"></script>
<script>
  // Hand-built to the same markup page-session-setup.js emits, so the CSS is
  // exercised exactly as it ships. (setsBlock is not exported.)
  const host = document.getElementById('host');
  const mk = (name, target, n, changed) => {
    const row = document.createElement('div');
    row.className = 'gv-card gv-setsrow' + (changed ? ' changed' : '');
    row.innerHTML = '';
    const main = document.createElement('div'); main.className = 'gv-setsrow-main';
    const nm = document.createElement('div'); nm.className = 'gv-setsrow-name'; nm.textContent = name;
    const tg = document.createElement('div'); tg.className = 'gv-setsrow-target'; tg.textContent = target + ' each set';
    main.append(nm, tg);
    const step = document.createElement('div'); step.className = 'gv-setsrow-stepper';
    const mkBtn = t => { const b = document.createElement('button'); b.className = 'gv-icon-btn gv-icon-btn-small clickable-icon'; b.textContent = t; return b; };
    const cnt = document.createElement('div'); cnt.className = 'gv-setsrow-count';
    const nEl = document.createElement('div'); nEl.className = 'gv-setsrow-n'; nEl.textContent = String(n);
    const un = document.createElement('div'); un.className = 'gv-setsrow-unit'; un.textContent = 'sets';
    cnt.append(nEl, un);
    step.append(mkBtn('−'), cnt, mkBtn('+'));
    row.append(main, step);
    return row;
  };
  const list = document.createElement('div'); list.className = 'gv-card-list';
  list.append(mk('Push-ups', '15', 5, true), mk('Bodyweight Squat', '25', 1, false), mk('Plank', '90s', 1, false));
  host.append(list);
</script>
</body></html>
